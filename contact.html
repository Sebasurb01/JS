<form id="cotizacionForm" class="space-y-4">

<input name="empresa" placeholder="EMPRESA" required class="w-full p-4 bg-slate-800 text-white text-xs uppercase"/>

<button id="btnEnviar" class="w-full bg-blue-600 text-white py-4 font-black uppercase">
Enviar Cotización Express
</button>

<p id="formMsg" class="hidden text-center text-xs font-bold"></p>

</form>

<footer class="main-footer">
<div class="container">
<p>Portafolio 2024</p>
</div>

<script>

const form = document.getElementById("cotizacionForm");
const msg = document.getElementById("formMsg");
const btn = document.getElementById("btnEnviar");

const N8N_WEBHOOK_URL = "https://sebassan.app.n8n.cloud/webhook-test/SEBASSANDEV";

form.addEventListener("submit", async e => {
e.preventDefault();

btn.textContent="Enviando...";
btn.disabled=true;

const data = Object.fromEntries(new FormData(form));

data.fecha=new Date().toISOString();

try{
await fetch(N8N_WEBHOOK_URL,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});

msg.textContent="✔ Enviado correctamente";
msg.classList.remove("hidden");
form.reset();

}catch{
msg.textContent="❌ Error al enviar";
msg.classList.remove("hidden");
}

btn.textContent="Enviar Cotización Express";
btn.disabled=false;

});

</script>
