<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Contacto</title>

<style>
body{font-family:Arial;margin:0;padding:0}
.container{display:flex;gap:20px;padding:20px}
form{width:40%}
input,textarea,button{width:100%;margin:10px 0;padding:10px}
iframe{width:60%;height:400px;border:0}
</style>

</head>

<body>

<h2 style="text-align:center">Formulario contacto</h2>

<div class="container">

<form id="cotizacionForm">

<input name="empresa" placeholder="Empresa" required>
<input type="email" name="email" placeholder="Email" required>
<textarea name="detalle" placeholder="Detalle" required></textarea>

<button type="submit" id="btnEnviar">Enviar</button>

<p id="formMsg"></p>

</form>

<iframe
src="https://www.google.com/maps/embed?pb=!1m17!1m12!1m3!1d15944.81727632322!2d-76.62173382116924!3d2.438866384602031"
loading="lazy">
</iframe>

</div>

<script>

var form = document.getElementById("cotizacionForm");
var msg = document.getElementById("formMsg");
var btn = document.getElementById("btnEnviar");

var WEBHOOK = "https://sebassan.app.n8n.cloud/webhook-test/SEBASSANDEV";

form.onsubmit = function(e){

e.preventDefault();

btn.disabled=true;
btn.innerHTML="Enviando...";

fetch(WEBHOOK,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
empresa:form.empresa.value,
email:form.email.value,
detalle:form.detalle.value
})
})

.then(function(){
msg.innerHTML="✔ enviado";
form.reset();
})

.catch(function(){
msg.innerHTML="❌ error";
})

.finally(function(){
btn.disabled=false;
btn.innerHTML="Enviar";
});

};

</script>

</body>
</html>
