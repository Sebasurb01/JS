<script>

document.addEventListener("DOMContentLoaded", () => {

const form = document.getElementById("cotizacionForm");
const msg = document.getElementById("formMsg");
const btn = document.getElementById("btnEnviar");

if(!form){
console.error("Formulario no encontrado");
return;
}

const N8N_WEBHOOK_URL = "https://sebassan.app.n8n.cloud/webhook-test/SEBASSANDEV";

form.addEventListener("submit", async (e) => {
e.preventDefault();

btn.textContent="Enviando...";
btn.disabled=true;

const payload = {
empresa: form.empresa.value,
email: form.email.value,
detalle: form.detalle.value
};

try{

const res = await fetch(N8N_WEBHOOK_URL,{
method:"POST",
headers:{ "Content-Type":"application/json" },
body: JSON.stringify(payload)
});

if(!res.ok) throw new Error();

msg.textContent="✔ Enviado correctamente";
msg.classList.remove("hidden");
msg.classList.add("text-green-400");

form.reset();

}catch(err){

console.error(err);

msg.textContent="❌ Error al enviar";
msg.classList.remove("hidden");
msg.classList.add("text-red-400");

}

btn.textContent="Enviar Cotización Express";
btn.disabled=false;

});

});
</script>
